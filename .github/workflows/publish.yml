name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require exact v{version} tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Refusing publication: release tag {actual!r} must equal {expected!r}")
          print(f"Release tag {actual!r} matches project version {version!r}.")
          PY

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghostscript poppler-utils tesseract-ocr fonts-dejavu-core

      - name: Install project and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic tests
        run: |
          python -m pytest testcases \
            --ignore=testcases/test_extraction.py \
            --ignore=testcases/test_layout.py \
            --ignore=testcases/test_rag.py \
            -v
          python -m pytest \
            testcases/test_layout.py::TestBackendAbstraction \
            testcases/test_rag.py::TestChunker \
            testcases/test_rag.py::TestCustomVectorStore \
            -v

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/doc-intel-kit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
