[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intel-kit"
version = "0.1.0"
description = "Composable document parsing, OCR, table extraction, structured extraction, LLM tasks, and in-memory RAG for Python."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kanishk S" }]
keywords = [
    "document-ai",
    "document-processing",
    "ocr",
    "table-extraction",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]

dependencies = [
    "pydantic>=2.6,<3.0",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<1.2",
    "python-pptx>=0.6.23,<0.7",
    "beautifulsoup4>=4.12,<4.13",
    "lxml>=5.2,<5.3",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.3,<10.4",
    "pdf2image>=1.17,<1.18",
    "layoutparser>=0.3.4,<0.4",
    "camelot-py[cv]>=0.11,<0.12",
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1,<3.2",
    "transformers>=4.41,<4.42",
    "sentence-transformers>=3.0,<3.1",
    "numpy>=1.26,<2.0",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
tabula = ["tabula-py>=2.9,<2.10"]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.10,<1.11",
    "pytest>=8.2,<8.3",
    "reportlab>=4.2,<4.3",
    "twine>=5.1,<7.0",
]

[project.urls]
Homepage = "https://github.com/kanizmadix/docintel-kit"
Documentation = "https://kanizmadix.github.io/docintel-kit/"
Source = "https://github.com/kanizmadix/docintel-kit"
Issues = "https://github.com/kanizmadix/docintel-kit/issues"

[tool.setuptools.packages.find]
include = ["docintel_kit*"]
