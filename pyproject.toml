[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel_kit"
version = "0.1.0"
description = "Unified local document parsing, OCR, layout analysis, table extraction, structured extraction, LLM tasks, and RAG toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    "pydantic>=2.6,<3.0",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<1.2",
    "python-pptx>=0.6.23,<0.7",
    "beautifulsoup4>=4.12,<4.13",
    "lxml>=5.2,<5.3",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.3,<10.4",
    "pdf2image>=1.17,<1.18",
    "layoutparser>=0.3.4,<0.4",
    "camelot-py[cv]>=0.11,<0.12",
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1,<3.2",
    "transformers>=4.41,<4.42",
    "sentence-transformers>=3.0,<3.1",
    "numpy>=1.26,<2.0",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
tabula = ["tabula-py>=2.9,<2.10"]
easyocr = ["easyocr>=1.7,<1.8"]
paddleocr = ["paddleocr>=2.7,<2.8"]
torch = ["torch>=2.3,<2.4"]
dev = ["pytest>=8.2,<8.3", "mypy>=1.10,<1.11"]

[tool.setuptools.packages.find]
include = ["docintel_kit*"]
